<!DOCTYPE html>
<html>
<head><title>Add Movie</title></head>
<body>
    <h1>Add a New Movie</h1>
    <nav>
        <a href="/">Home</a> | <a href="/add">Add a Movie</a> | <a href="/rankings">Rankings</a>
    </nav>
    <hr>
    <form method="POST">
        <label>Title: <input type="text" name="title" required></label><br><br>
        <label>Genre: <input type="text" name="genre" required></label><br><br>
        <label>Rating (1-10): <input type="number" name="rating" min="1" max="10" required></label><br><br>
        <button type="submit">Add Movie</button>
    </form>
</body>
</html>
